<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portafolio · FJordan2212</title>
  <meta name="description" content="Portafolio de proyectos de software." />
  <style>
    :root { --bg:#fafaf9; --card:#fff; --texto:#1c1917; --suave:#57534e; --borde:#e7e5e4; --acento:#047857; --chip:#d1fae5; --chip-t:#065f46; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0c0a09; --card:#1c1917; --texto:#fafaf9; --suave:#a8a29e; --borde:#292524; --acento:#34d399; --chip:#064e3b; --chip-t:#a7f3d0; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--texto); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.6; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
    header { padding: 72px 0 40px; }
    header p.sobre { color:var(--acento); font-weight:700; letter-spacing:.08em; text-transform:uppercase; font-size:.8rem; margin:0 0 10px; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); line-height:1.1; margin:0 0 14px; }
    header p.sub { color:var(--suave); max-width: 600px; margin:0; font-size:1.1rem; }
    h2 { font-size:1.3rem; margin: 0 0 20px; }
    .grid { display:grid; gap:20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); padding-bottom: 64px; }
    .card { background:var(--card); border:1px solid var(--borde); border-radius:18px; padding:26px; display:flex; flex-direction:column; gap:14px; }
    .card h3 { margin:0; font-size:1.25rem; }
    .curso { color:var(--acento); font-size:.85rem; font-weight:700; margin:0; }
    .card p.desc { margin:0; color:var(--suave); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { background:var(--chip); color:var(--chip-t); border-radius:999px; padding:4px 12px; font-size:.8rem; font-weight:700; }
    .links { display:flex; gap:10px; margin-top:auto; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; min-height:44px; padding:0 18px; border-radius:12px; font-weight:700; text-decoration:none; font-size:.95rem; }
    .btn.p { background:var(--acento); color:#052e2b; }
    .btn.s { border:1px solid var(--borde); color:var(--texto); }
    .btn:focus-visible { outline:3px solid var(--acento); outline-offset:2px; }
    footer { border-top:1px solid var(--borde); padding:28px 0; color:var(--suave); font-size:.9rem; }
    footer a { color:var(--acento); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="sobre">Portafolio</p>
      <h1>Proyectos de software</h1>
      <p class="sub">Estudiante de Ingeniería de Sistemas. Aquí guardo los proyectos que voy construyendo, con su código y las tecnologías que usé.</p>
    </header>
    <main>
      <h2>Proyectos</h2>
      <div class="grid" id="lista"></div>
    </main>
    <footer>© <span id="anio"></span> · <a href="https://github.com/FJordan2212">github.com/FJordan2212</a></footer>
  </div>
  <script src="projects.js"></script>
  <script>
    document.getElementById("anio").textContent = new Date().getFullYear();
    const lista = document.getElementById("lista");
    const el = (tag, cls, texto) => { const e = document.createElement(tag); if (cls) e.className = cls; if (texto) e.textContent = texto; return e; };
    for (const p of window.PROYECTOS) {
      const card = el("article", "card");
      card.append(el("p", "curso", p.curso), el("h3", "", p.titulo), el("p", "desc", p.descripcion));
      const chips = el("div", "chips");
      p.tecnologias.forEach((t) => chips.append(el("span", "chip", t)));
      card.append(chips);
      const links = el("div", "links");
      if (p.repo) { const a = el("a", "btn p", "Ver código"); a.href = p.repo; a.target = "_blank"; a.rel = "noopener"; links.append(a); }
      if (p.demo) { const a = el("a", "btn s", "Ver demo"); a.href = p.demo; a.target = "_blank"; a.rel = "noopener"; links.append(a); }
      card.append(links);
      lista.append(card);
    }
  </script>
</body>
</html>
